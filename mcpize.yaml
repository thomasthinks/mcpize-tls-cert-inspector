version: 1
runtime: typescript
entry: src/index.ts

build:
  install: npm ci
  command: npm run build

startCommand:
  type: http
  command: node dist/index.js

configSchema:
  source: code

pricing:
  protocol: x402
  network: base  # production: real USDC on Base mainnet (flipped 2026-10-05)
  recipient: "0x62c6da49028953919a4bd35d3092ac9277DA0a7D"
  asset: usdc
  tools:
    - name: inspect_cert
      price: "0.01"
      description: "Perform a live TLS handshake with a publicly reachable host and report the presented certificate: subject CN, issuer, validity window, days …"
    - name: check_expiry_bulk
      price: "0.01"
      description: "Inspect the TLS certificates of up to 20 hosts at once and get them sorted by days remaining, with critical (<7 days) and warning (<30 days)…"
